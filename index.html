    // Apply theme before paint to avoid a flash of the wrong color scheme.
    (function () {
      try {
        var saved = localStorage.getItem("colorMode");
        if (saved === "dark" || saved === null) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) { }
